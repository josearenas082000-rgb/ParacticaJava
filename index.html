<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
        <div class="container">
        <form action="dashboard.html" method="get">
            <fieldset>
                <h1>Dev<span class="luces">Plataform</span></h1>
                <p class="textoP">Ingresa tus credenciales para poder acceder al panel de control.</p>
                
                <label for="correo">Correo Electrónico *</label>
                <input type="email" name="correo" id="correo" required placeholder="ejemplo@correo.com">

                <label for="contraseña">Contraseña *</label>
                <input type="password" name="contraseña" id="contraseña" required minlength="7">
                
                <label for="rol">Rol de desarrollo *</label>
                <select name="desplegable" id="rol" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="desarrolladorFronted">Desarrollador Frontend</option>
                    <option value="desarrolladorBakend">Desarrollador Backend</option>
                    <option value="desarrolladorFullstack">Desarrollador FullStack</option>
                </select>

                <div class="checkbox">
                    <input type="checkbox" id="checkbox" required>
                    <label for="checkbox">Acepto los términos de servicio y privacidad.</label>
                </div>

                <button type="submit" class="btn-ingresar">Ingresar al DashBoard</button>
            </fieldset>
        </form>
    </div>
    
</body>
</html>
